set-option -g set-titles on
set-option -g set-titles-string "#S: #W"

set-option -g main-pane-height 6

# source: https://hamvocke.com/blog/a-guide-to-customizing-your-tmux-conf/
# https://github.com/hamvocke/dotfiles


# change the prefix from 'C-b' to 'C-a'
# (remap capslock to CTRL for easy access)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# start with window 1 (instead of 0)
set -g base-index 1

# start with pane 1
set -g pane-base-index 1

# Keep numbering gapless after a window is closed.
set -g renumber-windows on

# split panes using | and -, make sure they open in the same path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

unbind '"'
unbind %

# open new windows in the current path
bind c new-window -c "#{pane_current_path}"

# reload config file
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

unbind p
bind p previous-window

# Shorten the post-ESC wait so vim feels responsive. Deliberately not 0/1:
# over a laggy SSH link the bytes of an arrow/function-key sequence can arrive
# split, and too tight a window makes tmux read them as a bare ESC plus junk.
set -sg escape-time 10

# don't rename windows automatically
set -g allow-rename off

# mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# enable vi mode keys
set-window-option -g mode-keys vi

# Truecolor. TERM *inside* tmux must be a screen/tmux derivative (tmux(1)),
# so xterm-256color was wrong here. The outer terminal is then declared
# RGB-capable so 24-bit colour is passed through rather than quantised.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"

# Pass focus events through so vim's FocusGained/FocusLost (autoread) fire.
set -g focus-events on

# OSC 52: let a yank inside tmux set the *local* Mac clipboard straight through
# ghostty. This is what makes copying out of a remote session work at all.
# ghostty's terminfo carries the required Ms capability.
set -g set-clipboard on

# Default is 2000 lines, which one verbose build blows straight past.
set -g history-limit 20000

# present a menu of URLs to open from the visible pane. sweet.
bind u capture-pane \;\
    save-buffer /tmp/tmux-buffer \;\
    split-window -l 10 "urlview /tmp/tmux-buffer"
