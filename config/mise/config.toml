[settings]
# idiomatic_version_file = true
experimental = true
# trusted_config_paths = ["~/Code"]

# gh keeps its token in the macOS keychain, which mise's built-in gh lookup
# (hosts.yml only) can't see. Without it mise hits the 60/hour anonymous limit.
[settings.github]
credential_command = 'gh auth token --hostname "$MISE_CREDENTIAL_HOST"'

[settings.pipx]
uvx = true

[settings.ruby]
compile = false

[settings.self_update]
auto = true

# XDG base directories, set explicitly so every path below derives from them,
# and the tools that ignore XDG (or fall back to ~/Library on macOS) pointed at
# them. Set here rather than in fish so they also reach mise tasks and anything
# run under `mise x` — such as pitchfork daemons, whose supervisor starts from
# launchd and never sees the shell's environment. The comment is where each
# tool would write otherwise. A base dir already set from outside wins over the
# default: the work laptop's launchd puts data, state and cache under ~/dev, the
# only place Defender excludes from scanning.
[env]
XDG_CONFIG_HOME          = "{{get_env(name='XDG_CONFIG_HOME', default=env.HOME ~ '/.config')}}"
XDG_DATA_HOME            = "{{get_env(name='XDG_DATA_HOME', default=env.HOME ~ '/.local/share')}}"
XDG_STATE_HOME           = "{{get_env(name='XDG_STATE_HOME', default=env.HOME ~ '/.local/state')}}"
XDG_CACHE_HOME           = "{{get_env(name='XDG_CACHE_HOME', default=env.HOME ~ '/.cache')}}"
HOMEBREW_CACHE           = "{{env.XDG_CACHE_HOME}}/Homebrew"        # ~/Library/Caches/Homebrew
npm_config_cache         = "{{env.XDG_CACHE_HOME}}/npm"             # ~/.npm
PNPM_HOME                = "{{env.XDG_DATA_HOME}}/pnpm"             # ~/Library/pnpm, incl. the store
CARGO_HOME               = "{{env.XDG_DATA_HOME}}/cargo"            # ~/.cargo
RUSTUP_HOME              = "{{env.XDG_DATA_HOME}}/rustup"           # ~/.rustup
MBX_CACHE_DIR            = "{{env.XDG_CACHE_HOME}}/mbx"             # ~/Library/Caches/mbx
GOPATH                   = "{{env.XDG_DATA_HOME}}/go"               # ~/go
GOMODCACHE               = "{{env.XDG_CACHE_HOME}}/go-mod"          # ~/go/pkg/mod
GOCACHE                  = "{{env.XDG_CACHE_HOME}}/go-build"        # ~/Library/Caches/go-build
PIP_CACHE_DIR            = "{{env.XDG_CACHE_HOME}}/pip"             # ~/Library/Caches/pip
BUNDLE_USER_CONFIG       = "{{env.XDG_CONFIG_HOME}}/bundle/config"  # ~/.bundle/config
BUNDLE_USER_CACHE        = "{{env.XDG_CACHE_HOME}}/bundle"          # ~/.bundle/cache
BUNDLE_USER_PLUGIN       = "{{env.XDG_DATA_HOME}}/bundle/plugin"    # ~/.bundle/plugin
NUGET_PACKAGES           = "{{env.XDG_CACHE_HOME}}/NuGet/packages"  # ~/.nuget/packages
PLAYWRIGHT_BROWSERS_PATH = "{{env.XDG_CACHE_HOME}}/ms-playwright"   # ~/Library/Caches/ms-playwright
PUPPETEER_CACHE_DIR      = "{{env.XDG_CACHE_HOME}}/puppeteer"       # ~/.cache/puppeteer, even with XDG set
MAVEN_ARGS               = "-Dmaven.repo.local={{env.XDG_CACHE_HOME}}/maven/repository"  # ~/.m2/repository
MAVEN_USER_HOME          = "{{env.XDG_CACHE_HOME}}/maven"           # ~/.m2, where ./mvnw keeps its Maven download
HK_STATE_DIR             = "{{env.XDG_STATE_HOME}}/hk"              # ~/.local/state/hk, even with XDG set
HK_CACHE_DIR             = "{{env.XDG_CACHE_HOME}}/hk"              # ~/Library/Caches/hk
PITCHFORK_STATE_DIR      = "{{env.XDG_STATE_HOME}}/pitchfork"       # ~/.local/state/pitchfork, even with XDG set
STARSHIP_CACHE           = "{{env.XDG_CACHE_HOME}}/starship"        # ~/.cache/starship, even with XDG set
LIMA_HOME                = "{{env.XDG_DATA_HOME}}/lima"             # $XDG_CONFIG_HOME/colima/_lima, incl. Colima's VM disks

# For tools that ignore Docker contexts. Testcontainers mounts the socket into its
# Ryuk container, so it needs the path inside Colima's VM, not the one on the Mac.
DOCKER_HOST = "unix://{{env.XDG_CONFIG_HOME}}/colima/default/docker.sock"
TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE = "/var/run/docker.sock"

# The pitchfork supervisor is owned by its LaunchAgent (bin/pitchfork-supervisor),
# which also sets its proxy port. A client command starting its own supervisor
# would bind the wrong port, so it mustn't.
PITCHFORK_SUPERVISOR_AUTO_START = "false"

[tools]
pnpm = "latest"
ruby = "latest"
node = "latest"
age = "latest"
sops = "latest"
pitchfork = "latest"
hk = "latest"
aube = "latest"
fnox = "latest"
kubectl = "latest"
uv = "latest"
yq = "latest"
