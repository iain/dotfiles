# herdr configuration. Every option with its default: `herdr --default-config`.
# herdr's settings screen writes theme, sound and notification changes back
# through this symlink, so those show up as diffs in the dotfiles repo.

# The choices below are made here, so skip the first-run notification setup.
onboarding = false

[update]
# herdr has no telemetry; these two background requests to herdr.dev are all
# it sends. Homebrew upgrades herdr, which also brings a fresh copy of the
# agent-detection rules.
version_check = false
manifest_check = false

[worktrees]
# Outside every repo, so mise doesn't also load the main checkout's config.
# Claude's WorktreeCreate hook (claude/hooks/worktree-create.sh) routes its
# worktrees here too, so herdr, Claude and plain git share one layout:
# <directory>/<repo>/<branch-slug>.
directory = "~/Code/worktrees"

[keys]
# Each action has up to three keys: the ctrl+b prefix binding, a ctrl+alt
# chord, and the key Ghostty uses for the same thing (Cmd+T, Cmd+1…9, the
# vim-style ctrl+h/j/k/l). ctrl+alt chords are free in Ghostty
# (macos-option-as-alt makes option send alt), so they work now. The Ghostty
# keys only reach herdr once the herdr block at the end of the Ghostty config
# is uncommented; until then Ghostty keeps them for its own tabs and splits.
new_tab = ["prefix+c", "ctrl+alt+c", "cmd+t"]
switch_tab = ["prefix+1..9", "cmd+1..9"]
previous_tab = ["prefix+p", "ctrl+alt+[", "cmd+shift+[", "ctrl+shift+tab"]
next_tab = ["prefix+n", "ctrl+alt+]", "cmd+shift+]", "ctrl+tab"]
close_tab = ["prefix+shift+x", "cmd+alt+w"]
split_vertical = ["prefix+v", "ctrl+alt+d", "cmd+d"]
split_horizontal = ["prefix+minus", "ctrl+alt+shift+d", "cmd+shift+d"]
close_pane = ["prefix+x", "cmd+w"]
zoom = ["prefix+z", "ctrl+alt+z", "cmd+shift+enter"]
focus_pane_left = ["prefix+h", "ctrl+alt+h", "ctrl+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j", "ctrl+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k", "ctrl+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l", "ctrl+l"]
resize_pane_left = "cmd+ctrl+h"
resize_pane_down = "cmd+ctrl+j"
resize_pane_up = "cmd+ctrl+k"
resize_pane_right = "cmd+ctrl+l"
# TODO: once a herdr release has clear_pane (it's on master after 0.9.1), bind
# it to cmd+k and cmd+r and unbind those in the Ghostty block. Ghostty's
# clear_screen acts on herdr's display, not on the pane.

[[keys.command]]
key = ["prefix+t", "ctrl+alt+t"]
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "70%"
height = "60%"

[[keys.command]]
key = ["prefix+f", "ctrl+alt+f"]
type = "popup"
command = "pitchfork tui"
description = "pitchfork dashboard"
width = "90%"
height = "85%"

# Runs in the focused pane's directory, so it opens that branch's PR.
[[keys.command]]
key = ["prefix+alt+p", "ctrl+alt+p"]
type = "shell"
command = "gh pr view --web"
description = "open this branch's pull request"

[ui]
# Distinct shapes per state (× blocked, ◐ working, ✓ done, ○ idle), so the
# state doesn't depend on telling the custom theme's colors apart.
status_indicators = "symbols"

[ui.sidebar.agents]
# The first row is the only one with room to spare, so it carries what tells
# agents apart; where they run moves to the next row.
rows = [["state_icon", "tab"], ["machine", "workspace", "agent"]]

[ui.sidebar.agents.rows_by_agent]
# Claude sets the terminal title to the session name (from /rename or --name,
# otherwise its own generated title); the stripped form drops its spinner.
claude = [["state_icon", "terminal_title_stripped"], ["tab"], ["machine", "workspace"]]

[ui.toast]
# Ghostty turns this into a macOS notification when an agent in a background
# workspace finishes or needs input; prefix+o jumps to it.
delivery = "terminal"

